<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
  <title>Set up Maltiva POS</title>
  <link rel="stylesheet" href="setup.css">
  <script defer src="setup.js"></script>
</head>
<body>
  <main>
    <header><span class="brand">Maltiva POS</span><h1>Create your owner account</h1><p>Set up this till, then sign in to manage your store and staff.</p></header>
    <form id="setup-form">
      <fieldset id="fields">
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" maxlength="100" required autofocus>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-zA-Z0-9._\-]{3,32}" minlength="3" maxlength="32" aria-describedby="username-help" required>
        <p class="hint" id="username-help">3–32 letters, numbers, dots, underscores or hyphens.</p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="password-help" required>
        <p class="hint" id="password-help">Use at least 10 characters. Keep it somewhere safe.</p>
        <label for="confirmation">Confirm password</label>
        <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <label for="pin">Four-digit sign-in PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" minlength="4" maxlength="4" required>
        <p id="error" role="alert" tabindex="-1" hidden></p>
        <button type="submit" id="submit">Create owner account</button>
      </fieldset>
    </form>
    <footer>This account can manage staff, store settings and backups.</footer>
  </main>
</body>
</html>
